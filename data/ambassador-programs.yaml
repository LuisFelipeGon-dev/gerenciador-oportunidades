# Programas de embaixador e de liderança estudantil (lista curada).
#
# Cada item foi conferido na página oficial em `checked_on`. Quando o monitor
# (scripts/monitor.ts) avisa que a página mudou, confira e atualize o item e a data.
#
# Campos:
#   id                  identificador estável (não mude depois de publicado)
#   official_url        página oficial; é o destino do botão no site
#   monitor_url         página que o monitor acompanha (padrão: official_url)
#   monitor             false para páginas sem texto legível no HTML (padrão: true)
#   status              open | upcoming | closed
#   registration_deadline  AAAA-MM-DD, quando a página oficial informa
#   typical_open_months    meses (1 a 12) em que as inscrições costumam abrir
#   countries           códigos ISO dos países aceitos; vazio = sem restrição publicada
#   levels              undergraduate | graduate | phd
#   note                aviso exibido no card (ex.: informação não confirmada)

- id: claude-campus
  title: Claude Campus (embaixadores)
  organizer: Anthropic
  official_url: https://claude.com/programs/campus
  status: closed
  typical_open_months: [9]
  min_age: 18
  students_only: true
  levels: [undergraduate, graduate, phd]
  benefits: ["Bolsa de US$ 3.600", "Créditos de API (graduação)"]
  tags: [IA, Claude]
  checked_on: 2026-10-27
  # Página: inscrições de 1 a 12 de setembro; programa de setembro de 2026 a junho de 2027;
  # "The program is closed for Fall 2026."; aceita estudantes de qualquer país.

