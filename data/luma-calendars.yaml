# Calendários de comunidades brasileiras no Luma (lista curada).
#
# O coletor (src/collectors/luma.ts) lê o feed iCal público de cada calendário
# (api.lu.ma/ics/get?entity=calendar&id=<id>) e guarda só os eventos futuros no Brasil,
# ou online, porque todos os calendários desta lista são brasileiros.
#
# Campos:
#   id             id do calendário no Luma (cal-...); está no link "Assinar" da página
#   name           nome exibido como organizador
#   url            página do calendário no Luma
#   only_matching  opcional: só entram eventos cujo título contém este texto (sem diferenciar maiúsculas)
#   why            por que este calendário está na lista
#   checked_on     data em que o calendário foi conferido

