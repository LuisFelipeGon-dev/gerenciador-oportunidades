name: Coleta diária

on:
  schedule:
    # 09:17 UTC = 05:17 em Cuiabá. Minuto quebrado para fugir do pico de jobs na hora cheia.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Se o formato de uma fonte mudar, os testes com respostas salvas falham antes de gravar.
      - run: npm test

      # Falha (e o GitHub avisa por e-mail) se a coleta der erro ou vier vazia; o banco fica como estava.
      - run: npm run collect
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECTOR_CONTACT: https://github.com/${{ github.repository }}
