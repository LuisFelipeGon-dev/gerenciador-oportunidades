name: Coleta diária

on:
  schedule:
    # 09:17 UTC = 05:17 em Cuiabá. Minuto quebrado para fugir do pico de jobs na hora cheia.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Para abrir ou comentar a issue do monitor de páginas.
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Se o formato de uma fonte mudar, os testes com respostas salvas falham antes de gravar.
      - run: npm test

      # Falha (e o GitHub avisa por e-mail) se a coleta der erro ou vier vazia; o banco fica como estava.
      - run: npm run collect
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECTOR_CONTACT: https://github.com/${{ github.repository }}

      # Roda mesmo se uma fonte da coleta falhar: são tarefas independentes.
      - name: Monitor das páginas de programas
        if: ${{ !cancelled() }}
        run: npm run monitor -- --report=monitor-report.md
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECTOR_CONTACT: https://github.com/${{ github.repository }}

      # Uma issue aberta por vez: se já existe, as mudanças novas entram como comentário.
      - name: Avisar mudanças em issue
        if: ${{ !cancelled() && hashFiles('monitor-report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create monitor --color FBCA04 --description "Mudança em página oficial de programa" --force
          issue=$(gh issue list --label monitor --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file monitor-report.md
          else
            gh issue create --title "Páginas de programas mudaram: revisar o YAML" --label monitor --body-file monitor-report.md
          fi
